<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Combatetickets.mx — La boletera especializada en deportes de contacto en México.">
  <title>Combatetickets.mx</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    .landing {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #000;
    }

    .landing img {
      display: block;
      width: 100%;
      height: 100vh;
      object-fit: contain;
    }

    .instagram {
      position: absolute;
      left: 50%;
      bottom: 6.5%;
      transform: translateX(-50%);
      width: clamp(55px, 6.2vw, 95px);
      height: clamp(55px, 6.2vw, 95px);
      display: block;
      border-radius: 20%;
    }

    .instagram:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 5px;
    }
  </style>
</head>
<body>
  <main class="landing">
    <img src="landing.png" alt="Combatetickets.mx">
    <a
      class="instagram"
      href="https://www.instagram.com/combatetickets.mx/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram de Combatetickets.mx"></a>
  </main>
</body>
</html>
